name: Set up pnpm and Node.js
description: Install pnpm and set up Node.js with a pnpm dependency cache.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: "pnpm"
